# Single front door (port 80 in the container -> 5000 on your PC).
# Splits traffic to the three services by URL path.

upstream svc_web        { server web:5000; }
upstream svc_owner      { server owner:5000; }
upstream svc_superadmin { server superadmin:5000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;          # food photo / background uploads
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    location /owner/      { proxy_pass http://svc_owner; }
    location = /owner     { return 301 /owner/login; }

    location /superadmin/ { proxy_pass http://svc_superadmin; }
    location = /superadmin { return 301 /superadmin/; }

    # Everything else: landing, legal pages, /r/<slug> customer menu, public APIs, /static
    location / { proxy_pass http://svc_web; }
}
