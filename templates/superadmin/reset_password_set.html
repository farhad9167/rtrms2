<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap" style="max-width:380px">
  <div class="topbar"><h1>Set New Password</h1><span class="tag">Super Admin</span></div>
  <div class="card">
    <p style="color:var(--muted);font-size:12.5px">Google identity verified. Choose a new super-admin password.</p>
    {% if error %}<div class="msg" style="border-left-color:var(--warn)">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>New Password</label>
      <input type="password" name="password" required>
      <label>Confirm Password</label>
      <input type="password" name="confirm" required>
      <button type="submit" style="margin-top:14px;width:100%">Save New Password</button>
    </form>
  </div>
</div>
</body></html>
