<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm It's You — {{ restaurant.name }}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap" style="max-width:380px">
  <div class="topbar"><h1>{{ restaurant.name }}</h1><span class="tag">Confirm Password</span></div>
  <div class="card">
    <p style="color:var(--muted);font-size:12.5px">Google sign-in confirmed. Enter your account password to continue.</p>
    {% if error %}<div class="msg" style="border-left-color:var(--warn)">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Password</label>
      <input type="password" name="password" required autofocus>
      <button type="submit" style="margin-top:14px;width:100%">Unlock Dashboard</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:12px">
      <a href="{{ url_for('owner.reset_password_request') }}">Forgot password? Reset via Google</a>
    </p>
  </div>
</div>
</body></html>
