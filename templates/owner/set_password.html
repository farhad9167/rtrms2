<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Your Login Password</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap" style="max-width:380px">
  <div class="topbar"><h1>Secure Your Account</h1></div>
  <div class="card">
    <p style="color:var(--muted);font-size:12.5px">
      Set a password for your account. You'll need this every time you log in on any
      device — even one already signed into your Google account — so your restaurant
      stays protected if a phone or PC is shared or left unlocked.
    </p>
    {% if error %}<div class="msg" style="border-left-color:var(--warn)">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>New Password</label>
      <input type="password" name="password" required minlength="6">
      <label>Confirm Password</label>
      <input type="password" name="confirm" required minlength="6">
      <button type="submit" style="margin-top:14px;width:100%">Continue</button>
    </form>
  </div>
</div>
</body></html>
